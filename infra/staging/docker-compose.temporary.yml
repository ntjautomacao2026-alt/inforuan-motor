# INFORUAN — ambiente temporário na VPS compartilhada.
#
# Isolamento deliberado:
# - não usa nenhuma rede do EasyPanel;
# - não publica banco, runner ou backup;
# - o n8n escuta somente em 127.0.0.1 no host e exige túnel SSH;
# - nomes, volumes, rede e credenciais são exclusivos do INFORUAN;
# - limites rígidos evitam que este ambiente consuma os recursos dos projetos existentes.

name: inforuan-staging

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    container_name: inforuan-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n_inforuan
      POSTGRES_USER: n8n_inforuan
      POSTGRES_PASSWORD: ${INFORUAN_PG_PASSWORD:?defina INFORUAN_PG_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=128MB
    volumes:
      - inforuan_pg_data:/var/lib/postgresql/data
    networks:
      - inforuan_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n_inforuan -d n8n_inforuan"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    cpus: 0.50
    pids_limit: 200
    logging: *default-logging

  n8n:
    image: n8nio/n8n:2.35.4
    container_name: inforuan-staging-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n_inforuan
      DB_POSTGRESDB_USER: n8n_inforuan
      DB_POSTGRESDB_PASSWORD: ${INFORUAN_PG_PASSWORD}
      N8N_ENCRYPTION_KEY: ${INFORUAN_N8N_ENCRYPTION_KEY:?defina INFORUAN_N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_EDITOR_BASE_URL: http://localhost:5679/
      WEBHOOK_URL: http://localhost:5679/
      N8N_PROXY_HOPS: 0
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${INFORUAN_RUNNERS_TOKEN:?defina INFORUAN_RUNNERS_TOKEN}
      # CA pública do Supabase (pooler *.pooler.supabase.com): a credencial Postgres do n8n não tem campo de CA,
      # então ela entra aqui. Soma uma CA à lista padrão; não desliga nenhuma verificação (doc 16/17).
      NODE_EXTRA_CA_CERTS: /certs/supabase-prod-ca-2021.crt
    ports:
      - "127.0.0.1:5679:5678"
    volumes:
      - inforuan_n8n_data:/home/node/.n8n
      - ./certs/supabase-prod-ca-2021.crt:/certs/supabase-prod-ca-2021.crt:ro
    networks:
      - inforuan_backend
      - inforuan_egress
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    cpus: 0.80
    pids_limit: 300
    logging: *default-logging

  n8n-runner:
    image: n8nio/runners:2.35.4
    container_name: inforuan-staging-runner
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${INFORUAN_RUNNERS_TOKEN}
    networks:
      - inforuan_backend
    mem_limit: 384m
    cpus: 0.40
    pids_limit: 150
    logging: *default-logging

  pg-backup:
    image: prodrigestivill/postgres-backup-local:17
    container_name: inforuan-staging-pg-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: n8n_inforuan
      POSTGRES_USER: n8n_inforuan
      POSTGRES_PASSWORD: ${INFORUAN_PG_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "1"
      BACKUP_KEEP_MONTHS: "0"
      TZ: America/Sao_Paulo
    volumes:
      - inforuan_pg_backups:/backups
    networks:
      - inforuan_backend
    mem_limit: 128m
    cpus: 0.10
    pids_limit: 100
    logging: *default-logging

  # ─── WhatsApp (sessão Web) — Evolution PRÓPRIA do INFORUAN (doc 20). Sem porta publicada. ───
  evolution-postgres:
    image: postgres:17-alpine
    container_name: inforuan-staging-evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${INFORUAN_EVO_PG_PASSWORD:?defina INFORUAN_EVO_PG_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=32MB
    volumes:
      - inforuan_evo_pg:/var/lib/postgresql/data
    networks:
      - inforuan_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    cpus: 0.20
    pids_limit: 100
    logging: *default-logging

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: inforuan-staging-evolution
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
    environment:
      # A imagem traz um .env de exemplo e o script de início o aplica por cima do ambiente, a menos que DOCKER_ENV=true.
      DOCKER_ENV: "true"
      SERVER_NAME: inforuan-evolution
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://evolution:8080
      CORS_ORIGIN: "*"   # sem porta publicada e com chave obrigatória; CORS só afeta navegadores (n8n não envia Origin)
      LOG_LEVEL: ERROR,WARN
      LOG_COLOR: "false"
      LOG_BAILEYS: error
      DEL_INSTANCE: "false"
      LANGUAGE: pt-BR
      TELEMETRY_ENABLED: "false"
      PROMETHEUS_METRICS: "false"
      AUTHENTICATION_API_KEY: ${INFORUAN_EVO_API_KEY:?defina INFORUAN_EVO_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${INFORUAN_EVO_PG_PASSWORD}@evolution-postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: inforuan_evolution
      # Só a sessão fica na Evolution. Mensagens e contatos vivem apenas no motor (Supabase).
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      DATABASE_SAVE_IS_ON_WHATSAPP: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      # Webhook global → IR-02 do n8n pela rede interna (doc 20, Fase 3). A URL (com sufixo aleatório) fica só no .env.
      # Só os 4 eventos que o motor usa; todos os outros desligados explicitamente (o .env de exemplo da imagem liga vários).
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: ${INFORUAN_EVO_WEBHOOK_URL:?defina INFORUAN_EVO_WEBHOOK_URL}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_APPLICATION_STARTUP: "false"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "false"
      WEBHOOK_EVENTS_MESSAGES_SET: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_EDITED: "false"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      WEBHOOK_EVENTS_MESSAGES_DELETE: "false"
      WEBHOOK_EVENTS_SEND_MESSAGE: "true"
      WEBHOOK_EVENTS_SEND_MESSAGE_UPDATE: "false"
      WEBHOOK_EVENTS_CONTACTS_SET: "false"
      WEBHOOK_EVENTS_CONTACTS_UPSERT: "false"
      WEBHOOK_EVENTS_CONTACTS_UPDATE: "false"
      WEBHOOK_EVENTS_PRESENCE_UPDATE: "false"
      WEBHOOK_EVENTS_CHATS_SET: "false"
      WEBHOOK_EVENTS_CHATS_UPSERT: "false"
      WEBHOOK_EVENTS_CHATS_UPDATE: "false"
      WEBHOOK_EVENTS_CHATS_DELETE: "false"
      WEBHOOK_EVENTS_GROUPS_UPSERT: "false"
      WEBHOOK_EVENTS_GROUPS_UPDATE: "false"
      WEBHOOK_EVENTS_GROUP_PARTICIPANTS_UPDATE: "false"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_REMOVE_INSTANCE: "false"
      WEBHOOK_EVENTS_LOGOUT_INSTANCE: "false"
      WEBHOOK_EVENTS_LABELS_EDIT: "false"
      WEBHOOK_EVENTS_LABELS_ASSOCIATION: "false"
      WEBHOOK_EVENTS_CALL: "false"
      WEBHOOK_EVENTS_TYPEBOT_START: "false"
      WEBHOOK_EVENTS_TYPEBOT_CHANGE_STATUS: "false"
      WEBHOOK_EVENTS_ERRORS: "false"
      WEBHOOK_EVENTS_ERRORS_WEBHOOK: "false"
      RABBITMQ_ENABLED: "false"
      SQS_ENABLED: "false"
      WEBSOCKET_ENABLED: "false"
      PUSHER_ENABLED: "false"
      KAFKA_ENABLED: "false"
      TYPEBOT_ENABLED: "false"
      CHATWOOT_ENABLED: "false"
      OPENAI_ENABLED: "false"
      DIFY_ENABLED: "false"
      EVOAI_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: INFORUAN
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: "30"
    volumes:
      - inforuan_evo_instances:/evolution/instances
    networks:
      - inforuan_backend
      - inforuan_egress
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 20
    mem_limit: 768m
    cpus: 0.60
    pids_limit: 300
    logging: *default-logging

networks:
  inforuan_backend:
    name: inforuan-staging-backend
    internal: true
  inforuan_egress:
    name: inforuan-staging-egress

volumes:
  inforuan_n8n_data:
    name: inforuan-staging-n8n-data
  inforuan_pg_data:
    name: inforuan-staging-postgres17-data
  inforuan_pg_backups:
    name: inforuan-staging-postgres-backups
  inforuan_evo_pg:
    name: inforuan-staging-evolution-pg
  inforuan_evo_instances:
    name: inforuan-staging-evolution-instances
