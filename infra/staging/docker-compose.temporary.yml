# INFORUAN — ambiente temporário na VPS compartilhada.
#
# Isolamento deliberado:
# - não usa nenhuma rede do EasyPanel;
# - não publica banco, runner ou backup;
# - o n8n escuta somente em 127.0.0.1 no host e exige túnel SSH;
# - nomes, volumes, rede e credenciais são exclusivos do INFORUAN;
# - limites rígidos evitam que este ambiente consuma os recursos dos projetos existentes.

name: inforuan-staging

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    container_name: inforuan-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n_inforuan
      POSTGRES_USER: n8n_inforuan
      POSTGRES_PASSWORD: ${INFORUAN_PG_PASSWORD:?defina INFORUAN_PG_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=128MB
    volumes:
      - inforuan_pg_data:/var/lib/postgresql/data
    networks:
      - inforuan_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n_inforuan -d n8n_inforuan"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    cpus: 0.50
    pids_limit: 200
    logging: *default-logging

  n8n:
    image: n8nio/n8n:2.35.4
    container_name: inforuan-staging-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n_inforuan
      DB_POSTGRESDB_USER: n8n_inforuan
      DB_POSTGRESDB_PASSWORD: ${INFORUAN_PG_PASSWORD}
      N8N_ENCRYPTION_KEY: ${INFORUAN_N8N_ENCRYPTION_KEY:?defina INFORUAN_N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_EDITOR_BASE_URL: http://localhost:5679/
      WEBHOOK_URL: http://localhost:5679/
      N8N_PROXY_HOPS: 0
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${INFORUAN_RUNNERS_TOKEN:?defina INFORUAN_RUNNERS_TOKEN}
    ports:
      - "127.0.0.1:5679:5678"
    volumes:
      - inforuan_n8n_data:/home/node/.n8n
    networks:
      - inforuan_backend
      - inforuan_egress
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    cpus: 0.80
    pids_limit: 300
    logging: *default-logging

  n8n-runner:
    image: n8nio/runners:2.35.4
    container_name: inforuan-staging-runner
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${INFORUAN_RUNNERS_TOKEN}
    networks:
      - inforuan_backend
    mem_limit: 384m
    cpus: 0.40
    pids_limit: 150
    logging: *default-logging

  pg-backup:
    image: prodrigestivill/postgres-backup-local:17
    container_name: inforuan-staging-pg-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: n8n_inforuan
      POSTGRES_USER: n8n_inforuan
      POSTGRES_PASSWORD: ${INFORUAN_PG_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "1"
      BACKUP_KEEP_MONTHS: "0"
      TZ: America/Sao_Paulo
    volumes:
      - inforuan_pg_backups:/backups
    networks:
      - inforuan_backend
    mem_limit: 128m
    cpus: 0.10
    pids_limit: 100
    logging: *default-logging

networks:
  inforuan_backend:
    name: inforuan-staging-backend
    internal: true
  inforuan_egress:
    name: inforuan-staging-egress

volumes:
  inforuan_n8n_data:
    name: inforuan-staging-n8n-data
  inforuan_pg_data:
    name: inforuan-staging-postgres17-data
  inforuan_pg_backups:
    name: inforuan-staging-postgres-backups
